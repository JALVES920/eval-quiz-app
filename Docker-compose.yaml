services:
  database:
    build: ./database
    container_name: database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql   # Postgres 18 : pas de /data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"   # dev uniquement
    networks:
      - back-net

  backend:
    build: ./backend
    container_name: backend
    restart: unless-stopped
    environment:
      RESEND_API_KEY: ${RESEND_API_KEY}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "3007:3007"   # dev uniquement
    networks:
      - back-net
      - front-net

  database-nginx:
    build:
      context: ./database/nginx
      dockerfile: Dockerfile
    container_name: database-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - front-net

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - database-nginx
    networks:
      - front-net

networks:
  front-net:
  back-net:

volumes:
  pgdata: