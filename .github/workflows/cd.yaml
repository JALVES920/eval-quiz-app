name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # obligatoire pour la connexion OIDC

env:
  REGISTRY: sup2vinci.azurecr.io
  RG: quizz-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Tag unique
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build et push du backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/quiz-backend:latest
            ${{ env.REGISTRY }}/quiz-backend:${{ env.TAG }}

      - name: Build et push du front
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nginx/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/quiz-front:latest
            ${{ env.REGISTRY }}/quiz-front:${{ env.TAG }}

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Mise à jour des Container Apps
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update -n backend -g $RG --image $REGISTRY/quiz-backend:$TAG
          az containerapp update -n front   -g $RG --image $REGISTRY/quiz-front:$TAG